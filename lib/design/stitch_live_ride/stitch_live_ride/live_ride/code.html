<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Velocity - Live Ride</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#005964",
              "surface-container-highest": "#262626",
              "on-error": "#490006",
              "primary-dim": "#ff734c",
              "on-primary-fixed": "#000000",
              "outline": "#757575",
              "outline-variant": "#484848",
              "surface-container": "#191919",
              "tertiary-fixed-dim": "#2be800",
              "primary-fixed": "#ff7852",
              "on-tertiary-container": "#0b5800",
              "surface": "#0e0e0e",
              "surface-bright": "#2c2c2c",
              "tertiary": "#8eff71",
              "on-surface-variant": "#ababab",
              "error-dim": "#d7383b",
              "error-container": "#9f0519",
              "surface-variant": "#262626",
              "on-error-container": "#ffa8a3",
              "on-primary": "#5c1300",
              "inverse-surface": "#f9f9f9",
              "on-secondary": "#004d57",
              "secondary-container": "#006875",
              "surface-container-lowest": "#000000",
              "on-secondary-fixed": "#003a42",
              "primary-container": "#ff7852",
              "background": "#0e0e0e",
              "surface-dim": "#0e0e0e",
              "tertiary-container": "#2ff801",
              "inverse-on-surface": "#555555",
              "surface-container-low": "#131313",
              "on-primary-fixed-variant": "#581200",
              "on-background": "#ffffff",
              "primary-fixed-dim": "#ff5d2e",
              "secondary-fixed-dim": "#00d7f0",
              "on-primary-container": "#480d00",
              "inverse-primary": "#b22e00",
              "secondary": "#00e3fd",
              "secondary-fixed": "#26e6ff",
              "on-secondary-container": "#e8fbff",
              "on-tertiary-fixed": "#064200",
              "secondary-dim": "#00d4ec",
              "error": "#ff716c",
              "tertiary-dim": "#2be800",
              "surface-container-high": "#1f1f1f",
              "primary": "#ff8f70",
              "surface-tint": "#ff8f70",
              "on-tertiary": "#0d6100",
              "on-surface": "#ffffff",
              "tertiary-fixed": "#2ff801",
              "on-tertiary-fixed-variant": "#0d6200"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Manrope"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-glass {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, #0e0e0e 0%, transparent 15%, transparent 85%, #0e0e0e 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary-fixed overflow-hidden h-screen w-screen flex flex-col">
<!-- Top Navigation Suppressed for Focused Task (Live Ride) -->
<!-- Content starts here -->
<main class="relative flex-1 flex flex-col w-full h-full">
<!-- Live Map Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full relative">
<img class="w-full h-full object-cover opacity-40 brightness-75 grayscale" data-alt="Dark stylized satellite map of a winding mountain road with a glowing neon cyan path showing the cycling route" data-location="Stelvio Pass, Italy" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6BEyrr2hDkQbMQe60JOJJqGNZXTGWV1tTQhZ041IUQfUyYKn6sfssZWh-qcD_rNLSfQXWjmlgvnfoJ_tcvMs9ItFFUFJjsMMMHHYQe7vaZbBZaOq4rZndISrEtT4fZuHbFv6brlbREfjdFKevoUA69F06hSaBxbtdk9nVaRf5QZGM0AknQPuuBXz_YyqoG559-_4ziz_u-ggif6n0vmD62b3bkEnao93VOjLYqsFq_Zmf0anInpXvCphkiksFkgWa2d4p7LeZ2cY"/>
<div class="absolute inset-0 map-gradient-overlay"></div>
</div>
</div>
<!-- Upper Half: Glanceable Metrics -->
<div class="relative z-10 px-6 pt-12 pb-4 flex flex-col gap-6">
<!-- Header Status -->
<div class="flex justify-between items-center mb-2">
<div class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary-container/20 border border-primary/20">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="font-label text-[10px] font-bold tracking-widest uppercase text-primary">LIVE RIDE</span>
</div>
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-high/60 backdrop-blur-md">
<span class="material-symbols-outlined text-secondary text-sm">gps_fixed</span>
<span class="font-label text-[10px] font-bold text-on-surface-variant uppercase">Signal Strong</span>
</div>
</div>
<!-- Primary Metrics Stack -->
<div class="grid grid-cols-1 gap-4">
<div class="kinetic-glass rounded-xl p-6 border border-white/5 flex flex-col items-center">
<span class="font-label text-[11px] font-extrabold uppercase tracking-[0.2em] text-on-surface-variant mb-1">SPEED</span>
<div class="flex items-baseline gap-1">
<span class="text-[5rem] font-black italic tracking-tighter leading-none text-primary">34.2</span>
<span class="text-xl font-extrabold text-primary-dim uppercase italic">km/h</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="kinetic-glass rounded-xl p-5 border border-white/5">
<span class="font-label text-[10px] font-extrabold uppercase tracking-[0.2em] text-on-surface-variant mb-1">DISTANCE</span>
<div class="flex items-baseline gap-1">
<span class="text-4xl font-black text-on-surface">12.4</span>
<span class="text-xs font-bold text-on-surface-variant uppercase">km</span>
</div>
</div>
<div class="kinetic-glass rounded-xl p-5 border border-white/5">
<span class="font-label text-[10px] font-extrabold uppercase tracking-[0.2em] text-on-surface-variant mb-1">TIME</span>
<div class="flex items-baseline gap-1">
<span class="text-4xl font-black text-on-surface">24:18</span>
</div>
</div>
</div>
</div>
</div>
<!-- Spacer for Map Visibility -->
<div class="flex-1"></div>
<!-- Lower Half: Secondary Metrics & Controls -->
<div class="relative z-10 px-6 pb-10 flex flex-col gap-4">
<!-- Dynamic Mini Stats -->
<div class="grid grid-cols-2 gap-4">
<div class="kinetic-glass rounded-xl p-4 border border-white/5 flex items-center justify-between">
<div>
<span class="font-label text-[9px] font-extrabold uppercase tracking-widest text-on-surface-variant block mb-1">ELEVATION</span>
<span class="text-2xl font-black text-on-surface">342<span class="text-[10px] font-bold text-on-surface-variant ml-1 uppercase">m</span></span>
</div>
<span class="material-symbols-outlined text-tertiary">trending_up</span>
</div>
<div class="kinetic-glass rounded-xl p-4 border border-white/5 flex items-center justify-between">
<div>
<span class="font-label text-[9px] font-extrabold uppercase tracking-widest text-on-surface-variant block mb-1">CALORIES</span>
<span class="text-2xl font-black text-on-surface">285<span class="text-[10px] font-bold text-on-surface-variant ml-1 uppercase">kcal</span></span>
</div>
<span class="material-symbols-outlined text-secondary">local_fire_department</span>
</div>
</div>
<!-- Controls (Touch Optimized) -->
<div class="grid grid-cols-2 gap-6 mt-4">
<!-- Pause Button -->
<button class="h-20 rounded-xl kinetic-glass border border-white/10 flex items-center justify-center gap-3 active:scale-95 transition-transform">
<div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl">pause</span>
</div>
<span class="font-headline font-black text-white tracking-tighter text-xl">PAUSE</span>
</button>
<!-- Stop Button -->
<button class="h-20 rounded-xl bg-gradient-to-br from-error-container to-error-dim flex items-center justify-center gap-3 active:scale-95 transition-transform shadow-[0_15px_30px_rgba(159,5,25,0.4)]">
<div class="w-12 h-12 rounded-full bg-black/20 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">stop</span>
</div>
<span class="font-headline font-black text-on-background tracking-tighter text-xl">STOP</span>
</button>
</div>
<!-- Lock Interaction Hint -->
<div class="flex justify-center mt-2">
<div class="flex items-center gap-2 opacity-40">
<span class="material-symbols-outlined text-xs">lock</span>
<span class="font-label text-[9px] font-bold uppercase tracking-widest">Hold to finish ride</span>
</div>
</div>
</div>
<!-- Floating HR "Pulse" Chip Overlay -->
<div class="absolute left-6 bottom-[23rem] z-20">
<div class="flex items-center gap-3 px-4 py-2 bg-surface-container-highest/80 backdrop-blur-xl rounded-full border border-primary/20 shadow-xl">
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 bg-primary/40 rounded-full animate-ping"></div>
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="flex flex-col">
<span class="font-headline font-black text-lg leading-none">164</span>
<span class="font-label text-[8px] font-black text-primary uppercase">BPM</span>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Suppressed per 'focused journey' rule -->
</body></html>
